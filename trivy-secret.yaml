# Trivy secret-scanner configuration (picked up automatically from the repo root).
#
# The anthropic SDK (transitive dependency of langchain-anthropic) documents a
# redacted placeholder in its docstrings that matches the "gcp-service-account"
# rule, producing false-positive CRITICAL findings in the image scan. Allow the
# SDK's own files only; every other path is still scanned.
allow-rules:
  - id: anthropic-sdk-docstring-false-positive
    description: Redacted placeholder in anthropic SDK docstrings (not a credential)
    path: "(^|.*/)site-packages/anthropic/.*"
